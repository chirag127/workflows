# Pure GitHub Actions — data-only scrape APIs (oriz-india-holidays, oriz-air-quality,
#   oriz-currency-rates, oriz-flow-fii-dii, oriz-gold-silver, oriz-ifsc, india-budget,
#   india-petrol-diesel, india-train-schedules).
# Downstream: uses: chirag127/workflows/.github/workflows/ci-data-scrape-api.yml@main
# Replaces the dead Dagger engine (registry.dagger.io/engine:v0.21.8) with native steps.
# Mirrors dagger/data-scrape-api: lint (advisory) + JSON validation (gate). No Astro build.
# Scrape execution is left to each repo's own workflow.
name: ci-data-scrape-api
on:
  workflow_call:
jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install deps (if package.json)
        run: 'if [ -f package.json ]; then pnpm install --no-frozen-lockfile --ignore-scripts; fi'
      - name: Lint (advisory)
        run: pnpm run --if-present lint || true
      - name: Validate JSON parses
        run: |
          set -e
          FOUND=0
          for f in $(find . -maxdepth 4 -name '*.json' -not -path './node_modules/*' -not -path './.git/*' 2>/dev/null | head -100); do
            if ! jq empty "$f" >/dev/null 2>&1; then
              echo "INVALID JSON: $f"
              exit 1
            fi
            FOUND=$((FOUND + 1))
          done
          echo "OK — validated $FOUND JSON files"
