# Pure GitHub Actions — mdBook books (janaushdhi-book).
# Downstream: uses: chirag127/workflows/.github/workflows/ci-mdbook.yml@main
# Replaces the dead Dagger engine (registry.dagger.io/engine:v0.21.8) with native steps.
# Mirrors dagger/mdbook: skip gracefully when no book.toml, else `mdbook test` (lint) + `mdbook build`.
# Uses the prebuilt mdbook v0.4.40 release binary (no cargo build / cargo-registry cache needed).
name: ci-mdbook
on:
  workflow_call:
env:
  MDBOOK_VERSION: "0.4.40"
jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install mdbook
        run: |
          set -e
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL "$url" | tar -xz
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Build book
        run: |
          set -e
          if [ ! -f book.toml ]; then
            echo "skip: non-standard layout (no book.toml) — see repo's Build Book workflow"
            exit 0
          fi
          ./mdbook test
          ./mdbook build
