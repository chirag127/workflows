# Reusable: maintain CHANGELOG.md (Keep-a-Changelog format) from conventional commits.
# Commits back to main with [skip ci] to prevent re-trigger.
# Keyless LLM: pollinations primary; kilo fallback (needs KILO_API_KEY).
name: changelog
on:
  workflow_call:
    inputs:
      changelog_path:
        description: "Path to CHANGELOG.md relative to repo root"
        required: false
        type: string
        default: "CHANGELOG.md"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find last changelog entry date
        id: lastentry
        env:
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
        run: |
          if [ ! -f "${CHANGELOG_PATH}" ]; then
            echo "since=" >> "$GITHUB_OUTPUT"
          else
            LAST_DATE=$(grep -oP '\d{4}-\d{2}-\d{2}' "${CHANGELOG_PATH}" | head -1 || true)
            echo "since=${LAST_DATE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Gather new commits since last entry
        id: commits
        env:
          SINCE: ${{ steps.lastentry.outputs.since }}
        run: |
          if [ -n "${SINCE}" ]; then
            LOG=$(git log --oneline --no-merges --after="${SINCE} 23:59:59" | head -80)
          else
            LOG=$(git log --oneline --no-merges | head -80)
          fi
          if [ -z "${LOG}" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
            printf 'log<<EOFLOG\n%s\nEOFLOG\n' "${LOG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog section via LLM
        id: section
        if: steps.commits.outputs.empty != 'true'
        env:
          COMMIT_LOG: ${{ steps.commits.outputs.log }}
          REPO: ${{ github.repository }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          PROMPT="Generate a Keep-a-Changelog section. Date: ${TODAY}. Repo: ${REPO}. Format: ## [Unreleased] - ${TODAY} then ### Added / ### Changed / ### Fixed / ### Chore subsections. Omit empty sections. Bullets: imperative present tense, no hash, max 15 total. Return ONLY Markdown. Commits: ${COMMIT_LOG}"
          printf '%s' "${PROMPT}" > /tmp/llm_prompt.txt
          PAYLOAD=$(python3 -c "import json,sys; p=open('/tmp/llm_prompt.txt').read(); print(json.dumps({'model':'openai','messages':[{'role':'user','content':p}],'max_tokens':500,'temperature':0.1}))")

          RESULT=""
          if [ -n "${KILO_API_KEY}" ]; then
            RESULT=$(curl -sf --max-time 20 -X POST "https://api.kilo.ai/api/gateway/v1/chat/completions" \
              -H "Content-Type: application/json" -H "Authorization: Bearer ${KILO_API_KEY}" \
              -d "${PAYLOAD}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['choices'][0]['message']['content'].strip())" 2>/dev/null) || RESULT=""
          fi

          if [ -z "${RESULT}" ]; then
            RESULT=$(curl -sf --max-time 25 -X POST "https://text.pollinations.ai/openai" \
              -H "Content-Type: application/json" -H "Referer: https://oriz.in" \
              -d "${PAYLOAD}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['choices'][0]['message']['content'].strip())" 2>/dev/null) || RESULT=""
          fi

          if [ -z "${RESULT}" ]; then
            RESULT="## [Unreleased] - $(date -u +%Y-%m-%d)"$'\n'"### Changed"$'\n'"$(echo "${COMMIT_LOG}" | sed 's/^[a-f0-9]* /- /')"
          fi

          printf 'section<<EOFSEC\n%s\nEOFSEC\n' "${RESULT}" >> "$GITHUB_OUTPUT"

      - name: Write / prepend CHANGELOG.md
        if: steps.commits.outputs.empty != 'true'
        env:
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
          NEW_SECTION: ${{ steps.section.outputs.section }}
        run: |
          printf '%s' "${NEW_SECTION}" > /tmp/new_section.txt
          if [ ! -f "${CHANGELOG_PATH}" ]; then
            printf '# Changelog\n\nAll notable changes documented here. Format: [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).\n\n%s\n' "${NEW_SECTION}" > "${CHANGELOG_PATH}"
          else
            python3 -c "import sys,os; p=sys.argv[1]; ns=open('/tmp/new_section.txt').read(); c=open(p).read(); ls=c.split('\n'); i=next((j for j,l in enumerate(ls) if l.startswith('## ')),len(ls)); r='\n'.join(ls[:i]).rstrip()+'\n\n'+ns+'\n\n'+'\n'.join(ls[i:]).lstrip(); open(p,'w').write(r); print('Inserted at line',i)" "${CHANGELOG_PATH}"
          fi
          head -30 "${CHANGELOG_PATH}"

      - name: Commit CHANGELOG.md
        if: steps.commits.outputs.empty != 'true'
        env:
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${CHANGELOG_PATH}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update changelog [skip ci]" -- "${CHANGELOG_PATH}"
            git push
            echo "Pushed CHANGELOG.md update."
          fi
