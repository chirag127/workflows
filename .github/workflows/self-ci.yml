# Validates this repo itself: dagger.json schema for the remaining Dagger modules,
# the docs site generates, and actionlint passes on every workflow.
# Pure GitHub Actions — no Dagger engine is pulled here (the dead registry engine is gone).
# Does NOT touch dagger/*/sdk/ (generated codegen).
name: self-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dagger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate every dagger.json (schema + name matches dir)
        run: |
          cat > /tmp/validate-dagger.mjs <<'NODE'
          import fs from "node:fs";
          const [f, dir] = process.argv.slice(2);
          const j = JSON.parse(fs.readFileSync(f, "utf8"));
          const req = ["name", "engineVersion", "sdk", "source"];
          for (const k of req) {
            if (!(k in j)) {
              console.error(`${f}: missing "${k}"`);
              process.exit(1);
            }
          }
          if (j.name !== dir) {
            console.error(`${f}: name "${j.name}" != dir "${dir}"`);
            process.exit(1);
          }
          if (!j.sdk || j.sdk.source !== "typescript") {
            console.error(`${f}: sdk.source must be "typescript"`);
            process.exit(1);
          }
          console.log(`ok  ${f}`);
          NODE
          fail=0
          for f in dagger/*/dagger.json; do
            dir=$(basename "$(dirname "$f")")
            node /tmp/validate-dagger.mjs "$f" "$dir" || fail=1
          done
          exit "$fail"

  gen-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate site (must not error)
        run: node scripts/gen-docs.mjs
      - name: Fail if site/index.html empty
        run: test -s site/index.html

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          curl -sSfL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
      - name: Run actionlint
        run: /tmp/actionlint -color -shellcheck=
