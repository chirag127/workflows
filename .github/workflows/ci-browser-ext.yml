# Pure GitHub Actions — browser extensions (bookmark-mind-bs-ext, ai-rewrite).
# Downstream: uses: chirag127/workflows/.github/workflows/ci-browser-ext.yml@main
# Replaces the dead Dagger engine (registry.dagger.io/engine:v0.21.8) with native steps.
# Mirrors dagger/browser-ext: pnpm install (ignore-scripts) -> lint + typecheck -> build.
# Missing scripts are no-ops via `pnpm run --if-present`. pnpm store cached (was cacheVolume("pnpm-store")).
name: ci-browser-ext
on:
  workflow_call:
jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', '**/package.json') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Lint
        run: pnpm run --if-present lint
      - name: Typecheck
        run: pnpm run --if-present typecheck
      - name: Build
        run: pnpm run --if-present build
