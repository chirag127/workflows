# Pure GitHub Actions — VS Code extensions (sops-lens-vsc-ext).
# Downstream: uses: chirag127/workflows/.github/workflows/ci-vsc-ext.yml@main
# Replaces the dead Dagger engine (registry.dagger.io/engine:v0.21.8) with native steps.
# Mirrors dagger/vsc-ext: pnpm install (ignore-scripts) -> lint + typecheck (--if-present)
#   -> build (runs `build` then `compile` if present — some VS Code exts use tsc-native `compile`).
# pnpm store cached (was cacheVolume("pnpm-store")). Package/publish stay umbrella-only, not part of ci().
name: ci-vsc-ext
on:
  workflow_call:
jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', '**/package.json') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Lint
        run: pnpm run --if-present lint
      - name: Typecheck
        run: pnpm run --if-present typecheck
      - name: Build
        run: pnpm run --if-present build && pnpm run --if-present compile
