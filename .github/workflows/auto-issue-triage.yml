# Reusable: classify new issues by severity + component, apply labels.
# Keyless LLM: pollinations (primary) → no key required.
# Kilo fallback requires KILO_API_KEY secret (optional).
name: auto-issue-triage
on:
  workflow_call:
    inputs:
      components:
        description: "Comma-separated component names relevant to this repo (e.g. api,ui,cli)"
        required: false
        type: string
        default: "core,docs,ci,deps"

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Classify issue via LLM
        id: classify
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMPONENTS: ${{ inputs.components }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
        run: |
          PROMPT="Classify this GitHub issue. Return ONLY valid JSON with keys: severity (critical|high|medium|low), component (one of: ${COMPONENTS}), labels (array of strings from: bug, enhancement, documentation, question, wontfix, security, performance, breaking-change).

          Title: ${ISSUE_TITLE}
          Body: ${ISSUE_BODY:-'(empty)'}

          Rules:
          - critical: data loss, security vuln, crash on start
          - high: major feature broken, no workaround
          - medium: degraded feature, has workaround
          - low: cosmetic, docs, minor
          - component: pick closest match from the provided list
          - labels: 1-3 labels, always include at least one of bug/enhancement/documentation/question

          Return JSON only, no markdown, no explanation."

          PAYLOAD=$(python3 -c "
          import json, os
          print(json.dumps({
            'model': 'openai',
            'messages': [{'role': 'user', 'content': os.environ['PROMPT']}],
            'max_tokens': 200,
            'temperature': 0
          }))
          ")

          # Try kilo first if key present
          RESULT=""
          if [ -n "${KILO_API_KEY}" ]; then
            RESULT=$(curl -sf --max-time 15 \
              -X POST "https://api.kilo.ai/api/gateway/v1/chat/completions" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${KILO_API_KEY}" \
              -d "${PAYLOAD}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['choices'][0]['message']['content'].strip())" 2>/dev/null || true)
          fi

          # Fallback: pollinations (keyless)
          if [ -z "${RESULT}" ]; then
            RESULT=$(curl -sf --max-time 20 \
              -X POST "https://text.pollinations.ai/openai" \
              -H "Content-Type: application/json" \
              -H "Referer: https://oriz.in" \
              -d "${PAYLOAD}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['choices'][0]['message']['content'].strip())" 2>/dev/null || true)
          fi

          echo "LLM raw: ${RESULT}"

          # Parse JSON; fall back to defaults on parse failure
          SEVERITY=$(echo "${RESULT}" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print(d.get('severity','medium'))" 2>/dev/null || echo "medium")
          COMPONENT=$(echo "${RESULT}" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print(d.get('component','core'))" 2>/dev/null || echo "core")
          LABELS=$(echo "${RESULT}" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print(','.join(d.get('labels',['question'])))" 2>/dev/null || echo "question")

          echo "severity=${SEVERITY}" >> "$GITHUB_OUTPUT"
          echo "component=${COMPONENT}" >> "$GITHUB_OUTPUT"
          echo "labels=${LABELS}" >> "$GITHUB_OUTPUT"

      - name: Ensure severity labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          declare -A COLORS=(
            ["severity: critical"]="b60205"
            ["severity: high"]="e11d48"
            ["severity: medium"]="f97316"
            ["severity: low"]="84cc16"
          )
          for label in "${!COLORS[@]}"; do
            color="${COLORS[$label]}"
            gh label create "${label}" --color "${color}" --repo "${REPO}" 2>/dev/null || true
          done

      - name: Ensure component label exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMPONENT: ${{ steps.classify.outputs.component }}
        run: |
          gh label create "component: ${COMPONENT}" --color "0ea5e9" --repo "${REPO}" 2>/dev/null || true

      - name: Apply labels to issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SEVERITY: ${{ steps.classify.outputs.severity }}
          COMPONENT: ${{ steps.classify.outputs.component }}
          EXTRA_LABELS: ${{ steps.classify.outputs.labels }}
        run: |
          # Build label list: severity + component + extra
          ALL_LABELS="severity: ${SEVERITY},component: ${COMPONENT}"
          if [ -n "${EXTRA_LABELS}" ]; then
            # Ensure extra labels exist (best-effort create)
            IFS=',' read -ra LBLS <<< "${EXTRA_LABELS}"
            for lbl in "${LBLS[@]}"; do
              lbl=$(echo "$lbl" | xargs)  # trim whitespace
              gh label create "${lbl}" --color "6e7781" --repo "${REPO}" 2>/dev/null || true
              ALL_LABELS="${ALL_LABELS},${lbl}"
            done
          fi
          gh issue edit "${ISSUE_NUMBER}" --add-label "${ALL_LABELS}" --repo "${REPO}"
          echo "Applied labels: ${ALL_LABELS} to issue #${ISSUE_NUMBER}"
