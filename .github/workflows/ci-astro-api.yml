# Pure GitHub Actions — Astro static APIs (constants, countries-plus, dynasties, ragas, rto, mmi-tickertape).
# Downstream: uses: chirag127/workflows/.github/workflows/ci-astro-api.yml@v1
# Replaces the dead Dagger engine (registry.dagger.io/engine:v0.21.8) with native steps.
# Mirrors dagger/astro-api: pnpm install (ignore-scripts) -> lint + typecheck (--if-present) -> build (required).
# pnpm store cached (was cacheVolume("pnpm-store")). No tests (API repos are data-first).
name: ci-astro-api
on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', '**/package.json') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Lint
        run: pnpm run --if-present lint
      - name: Typecheck
        run: pnpm run --if-present typecheck
      - name: Build
        run: pnpm run build

  strix:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash
      - name: Run Strix
        env:
          STRIX_LLM: openai/@cf/meta/llama-4-scout-17b-16e-instruct
          LLM_API_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LLM_API_BASE: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/ai/v1
        run: strix -n -t ./ --scan-mode quick
