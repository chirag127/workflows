# Reusable: generate release notes from commits+PRs since last tag.
# Groups into Features / Fixes / Chore. Updates the release body via gh.
# Keyless LLM: pollinations primary; kilo fallback (needs KILO_API_KEY).
name: release-notes
on:
  workflow_call:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gather commits since last tag
        id: commits
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          CURRENT_TAG="${TAG}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -1 || true)
          if [ -z "${PREV_TAG}" ]; then
            LOG=$(git log --oneline --no-merges | head -60)
          else
            LOG=$(git log "${PREV_TAG}..HEAD" --oneline --no-merges | head -60)
          fi
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          printf 'log<<EOFLOG\n%s\nEOFLOG\n' "${LOG}" >> "$GITHUB_OUTPUT"

      - name: Generate notes via LLM
        id: notes
        env:
          COMMIT_LOG: ${{ steps.commits.outputs.log }}
          TAG: ${{ github.event.release.tag_name }}
          PREV_TAG: ${{ steps.commits.outputs.prev_tag }}
          REPO: ${{ github.repository }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
        run: |
          PROMPT="Generate GitHub release notes (Markdown) from these commits. Release: ${TAG} prev: ${PREV_TAG:-first}. Repo: ${REPO}. Group into: ## What's Changed, ### Features (feat), ### Fixes (fix/perf/revert), ### Chore / Deps (chore/ci/docs/build/refactor/test). Each bullet: concise phrase, no hash. Max 20 bullets. Return ONLY Markdown. Commits: ${COMMIT_LOG}"
          printf '%s' "${PROMPT}" > /tmp/llm_prompt.txt
          PAYLOAD=$(python3 -c "import json,sys; p=open('/tmp/llm_prompt.txt').read(); print(json.dumps({'model':'openai','messages':[{'role':'user','content':p}],'max_tokens':600,'temperature':0.2}))")

          RESULT=""
          if [ -n "${KILO_API_KEY}" ]; then
            RESULT=$(curl -sf --max-time 20 -X POST "https://api.kilo.ai/api/gateway/v1/chat/completions" \
              -H "Content-Type: application/json" -H "Authorization: Bearer ${KILO_API_KEY}" \
              -d "${PAYLOAD}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['choices'][0]['message']['content'].strip())" 2>/dev/null) || RESULT=""
          fi

          if [ -z "${RESULT}" ]; then
            RESULT=$(curl -sf --max-time 25 -X POST "https://text.pollinations.ai/openai" \
              -H "Content-Type: application/json" -H "Referer: https://oriz.in" \
              -d "${PAYLOAD}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['choices'][0]['message']['content'].strip())" 2>/dev/null) || RESULT=""
          fi

          if [ -z "${RESULT}" ]; then
            RESULT="## What's Changed"$'\n'"${COMMIT_LOG}"
          fi

          echo "Generated notes:"
          echo "${RESULT}"
          printf 'body<<EOFBODY\n%s\nEOFBODY\n' "${RESULT}" >> "$GITHUB_OUTPUT"

      - name: Update release body
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          BODY: ${{ steps.notes.outputs.body }}
        run: |
          gh release edit "${TAG}" --notes "${BODY}" --repo "${REPO}"
          echo "Updated release ${TAG}."
